name: CI/CD & Deploy to Render

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Pytest Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-asyncio httpx

      - name: Run Tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v

  deploy:
    name: Trigger Deploy to Render
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_HOOK" ]; then
            echo "ℹ️ Chưa cấu hình secret RENDER_DEPLOY_HOOK_URL trên GitHub."
            echo "Nếu bạn bật Auto-Deploy trên Render, Render sẽ tự động deploy mỗi khi push code."
            echo "Để chỉ deploy sau khi test PASS 100%, hãy thêm RENDER_DEPLOY_HOOK_URL vào GitHub Secrets."
          else
            echo "🚀 Đã vượt qua 100% bài test! Đang kích hoạt Deploy trên Render..."
            curl -f -X POST "$RENDER_HOOK"
            echo "✅ Đã gửi tín hiệu deploy thành công đến Render!"
          fi
